<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="'Courier New',ui-monospace,monospace" role="img" aria-label="C3n7ral051nt4g3ncy OSINT banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0b16"/>
      <stop offset="1" stop-color="#05040a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6ee7ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect x="2" y="2" width="996" height="296" rx="14"/></clipPath>
  </defs>

  <!-- backdrop -->
  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#sky)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <!-- horizon glow -->
    <ellipse cx="500" cy="300" rx="520" ry="150" fill="#a855f7" opacity="0.14" filter="url(#softglow)"/>

    <!-- moving scanline -->
    <rect x="0" width="1000" height="2" fill="#22d3ee" opacity="0.25">
      <animate attributeName="y" values="-4;304" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <!-- faint flicker overlay -->
    <rect width="1000" height="300" fill="#22d3ee" opacity="0">
      <animate attributeName="opacity" values="0;0.03;0;0.02;0" dur="3.7s" repeatCount="indefinite"/>
    </rect>

    <!-- terminal boot lines (type-in via width reveal) -->
    <g font-size="13" fill="#6ee7b7" opacity="0.92">
      <text x="34" y="46">
        <tspan fill="#8b7ff5">root@osint</tspan>:<tspan fill="#22d3ee">~</tspan># ./deploy --identity
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.05;0.12" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="66" fill="#9aa0b5">[<tspan fill="#6ee7b7">OK</tspan>] modules: SOCMINT · GEOINT · IMINT · DARKWEB
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.16;0.22" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="34" y="86" fill="#9aa0b5">[<tspan fill="#6ee7b7">OK</tspan>] secure channel established — tracing enabled
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.28;0.34" dur="7s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- glitch handle: magenta + cyan twins under a white core -->
    <g font-size="52" font-weight="bold" text-anchor="middle" letter-spacing="1">
      <text x="500" y="178" fill="#ff3cac" opacity="0.65">C3n7ral051nt4g3ncy
        <animate attributeName="dx" values="0;-3;2;0;3;-2;0" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.0;0.6;0.2;0.7;0.3;0.6" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="178" fill="#22d3ee" opacity="0.65">C3n7ral051nt4g3ncy
        <animate attributeName="dx" values="0;3;-2;0;-3;2;0" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.0;0.5;0.3;0.6;0.2;0.5" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="178" fill="#ffffff" filter="url(#glow)">C3n7ral051nt4g3ncy</text>
    </g>

    <!-- underline sweep -->
    <rect x="250" y="196" width="500" height="2" fill="url(#neon)" opacity="0.9"/>
    <rect x="250" y="196" width="90" height="2" fill="#ffffff" opacity="0.9">
      <animate attributeName="x" values="250;660;250" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <!-- role line -->
    <text x="500" y="226" text-anchor="middle" font-size="15" letter-spacing="4" fill="#c9c4e8">
      OSINT OPERATOR // CTF ENGINEER // TRAINER
    </text>

    <!-- blinking prompt -->
    <g font-size="15" fill="#6ee7b7">
      <text x="406" y="262">&gt; awaiting target_</text>
      <rect x="548" y="251" width="9" height="14" fill="#6ee7b7">
        <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- radar sweep, bottom-right motif -->
    <g transform="translate(905,235)" opacity="0.9">
      <circle r="34" fill="none" stroke="#22d3ee" stroke-opacity="0.25"/>
      <circle r="22" fill="none" stroke="#22d3ee" stroke-opacity="0.2"/>
      <circle r="10" fill="none" stroke="#22d3ee" stroke-opacity="0.2"/>
      <line x1="0" y1="0" x2="34" y2="0" stroke="#22d3ee" stroke-width="0" stroke-opacity="0"/>
      <g>
        <path d="M0 0 L34 0 A34 34 0 0 1 24 24 Z" fill="#22d3ee" opacity="0.18"/>
        <line x1="0" y1="0" x2="34" y2="0" stroke="#6ee7ff" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/>
      </g>
      <circle r="2.5" fill="#a855f7"/>
    </g>

    <!-- corner brackets -->
    <g stroke="#a855f7" stroke-width="2" fill="none" opacity="0.8">
      <path d="M16 40 V16 H40"/>
      <path d="M984 40 V16 H960"/>
      <path d="M16 260 V284 H40"/>
      <path d="M984 260 V284 H960"/>
    </g>
  </g>
  <rect x="2" y="2" width="996" height="296" rx="14" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
